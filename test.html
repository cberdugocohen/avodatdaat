<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מרחב הדעת - בדיקת פונקציונליות</title>
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f8f8f8;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .test-button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .test-button:hover {
            background: #45a049;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: right;
        }
        .success {
            color: green;
        }
        .failure {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>בדיקת פונקציונליות מרחב הדעת</h1>
        
        <div>
            <button class="test-button" id="testFiles">בדיקת קבצים</button>
            <button class="test-button" id="testState">בדיקת מצב</button>
            <button class="test-button" id="testUI">בדיקת ממשק</button>
            <button class="test-button" id="testEvents">בדיקת אירועים</button>
        </div>
        
        <div class="result" id="result">
            תוצאות הבדיקה יופיעו כאן...
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resultDiv = document.getElementById('result');
            
            // Test Files
            document.getElementById('testFiles').addEventListener('click', async () => {
                resultDiv.innerHTML = 'בודק קבצים...';
                
                try {
                    const files = [
                        'index.html',
                        'styles.css',
                        'styles-modals.css',
                        'script.js',
                        'data.js',
                        'ui.js',
                        'events.js'
                    ];
                    
                    const results = await Promise.all(files.map(async file => {
                        try {
                            const response = await fetch(file);
                            return {
                                file,
                                status: response.ok ? 'נמצא' : 'לא נמצא',
                                ok: response.ok
                            };
                        } catch (e) {
                            return {
                                file,
                                status: 'שגיאה',
                                ok: false
                            };
                        }
                    }));
                    
                    const allOk = results.every(r => r.ok);
                    
                    let html = `<h3 class="${allOk ? 'success' : 'failure'}">
                        ${allOk ? '✓ כל הקבצים נמצאו' : '✗ חלק מהקבצים חסרים'}
                    </h3><ul>`;
                    
                    results.forEach(r => {
                        html += `<li>${r.file}: <span class="${r.ok ? 'success' : 'failure'}">${r.status}</span></li>`;
                    });
                    
                    html += '</ul>';
                    resultDiv.innerHTML = html;
                } catch (e) {
                    resultDiv.innerHTML = `<p class="failure">שגיאה בבדיקת הקבצים: ${e.message}</p>`;
                }
            });
            
            // Test State
            document.getElementById('testState').addEventListener('click', () => {
                resultDiv.innerHTML = 'בודק מצב...';
                
                try {
                    // Check if state object exists in window
                    if (typeof state === 'undefined') {
                        resultDiv.innerHTML = `<p class="failure">✗ אובייקט המצב (state) לא נמצא</p>`;
                        return;
                    }
                    
                    // Check if localStorage is available
                    let localStorageAvailable = false;
                    try {
                        localStorage.setItem('test', 'test');
                        localStorage.removeItem('test');
                        localStorageAvailable = true;
                    } catch (e) {
                        localStorageAvailable = false;
                    }
                    
                    let html = `<h3>בדיקת מצב:</h3><ul>`;
                    html += `<li>אובייקט מצב: <span class="success">✓ נמצא</span></li>`;
                    html += `<li>localStorage: <span class="${localStorageAvailable ? 'success' : 'failure'}">
                        ${localStorageAvailable ? '✓ זמין' : '✗ לא זמין'}
                    </span></li>`;
                    
                    // Check if functions exist
                    const functions = ['loadState', 'saveState', 'loadCurrentCard', 'nextCard', 'prevCard', 'flipCard'];
                    functions.forEach(func => {
                        const exists = typeof window[func] === 'function';
                        html += `<li>פונקציה ${func}: <span class="${exists ? 'success' : 'failure'}">
                            ${exists ? '✓ קיימת' : '✗ חסרה'}
                        </span></li>`;
                    });
                    
                    html += '</ul>';
                    resultDiv.innerHTML = html;
                } catch (e) {
                    resultDiv.innerHTML = `<p class="failure">שגיאה בבדיקת המצב: ${e.message}</p>`;
                }
            });
            
            // Test UI
            document.getElementById('testUI').addEventListener('click', () => {
                resultDiv.innerHTML = 'בודק ממשק...';
                
                try {
                    // Check if UI elements exist
                    const elements = [
                        { id: 'onboardingModal', name: 'מודל הדרכה' },
                        { id: 'settingsModal', name: 'מודל הגדרות' },
                        { id: 'albumModal', name: 'מודל אלבום' },
                        { id: 'helpModal', name: 'מודל עזרה' },
                        { id: 'noteEditor', name: 'עורך הערות' },
                        { selector: '.scene', name: 'סצנת כרטיס' },
                        { selector: '.card', name: 'כרטיס' },
                        { selector: '.card-front', name: 'חזית כרטיס' },
                        { selector: '.card-back', name: 'גב כרטיס' },
                        { selector: '.controls', name: 'כפתורי שליטה' }
                    ];
                    
                    let html = `<h3>בדיקת ממשק:</h3><ul>`;
                    
                    elements.forEach(el => {
                        let element;
                        if (el.id) {
                            element = document.getElementById(el.id);
                        } else if (el.selector) {
                            element = document.querySelector(el.selector);
                        }
                        
                        const exists = !!element;
                        html += `<li>${el.name}: <span class="${exists ? 'success' : 'failure'}">
                            ${exists ? '✓ נמצא' : '✗ חסר'}
                        </span></li>`;
                    });
                    
                    html += '</ul>';
                    resultDiv.innerHTML = html;
                } catch (e) {
                    resultDiv.innerHTML = `<p class="failure">שגיאה בבדיקת הממשק: ${e.message}</p>`;
                }
            });
            
            // Test Events
            document.getElementById('testEvents').addEventListener('click', () => {
                resultDiv.innerHTML = 'בודק אירועים...';
                
                try {
                    // Check if event functions exist
                    const functions = [
                        'setupCardNavigation', 
                        'setupCardControls', 
                        'setupNoteEditor',
                        'setupKeyboardNavigation',
                        'setupTouchGestures'
                    ];
                    
                    let html = `<h3>בדיקת אירועים:</h3><ul>`;
                    
                    functions.forEach(func => {
                        const exists = typeof window[func] === 'function';
                        html += `<li>פונקציה ${func}: <span class="${exists ? 'success' : 'failure'}">
                            ${exists ? '✓ קיימת' : '✗ חסרה'}
                        </span></li>`;
                    });
                    
                    // Check if event listeners are attached
                    const hasEventListeners = typeof document.addEventListener === 'function';
                    html += `<li>תמיכה במאזיני אירועים: <span class="${hasEventListeners ? 'success' : 'failure'}">
                        ${hasEventListeners ? '✓ קיימת' : '✗ חסרה'}
                    </span></li>`;
                    
                    html += '</ul>';
                    resultDiv.innerHTML = html;
                } catch (e) {
                    resultDiv.innerHTML = `<p class="failure">שגיאה בבדיקת האירועים: ${e.message}</p>`;
                }
            });
        });
    </script>
</body>
</html>
