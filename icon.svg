<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDFBF7"/>
      <stop offset="100%" style="stop-color:#EBE7DF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B38728"/>
      <stop offset="100%" style="stop-color:#BF953F"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Gold border inset -->
  <rect x="32" y="32" width="448" height="448" rx="72" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
  <!-- Hebrew letter מ stylized -->
  <text x="256" y="300" text-anchor="middle" font-family="serif" font-size="220" font-weight="800" fill="url(#gold)">מ</text>
  <!-- Subtitle -->
  <text x="256" y="400" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="600" fill="#B38728" opacity="0.8">מרחב הדעת</text>
</svg>
