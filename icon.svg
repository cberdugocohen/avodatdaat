<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F0E8D4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#BF953F"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Decorative border -->
  <rect x="32" y="32" width="448" height="448" rx="72" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.3"/>
  <!-- Open book / card shape -->
  <g transform="translate(256,220)" fill="url(#gold)">
    <rect x="-80" y="-60" width="72" height="100" rx="6" opacity="0.15"/>
    <rect x="8" y="-60" width="72" height="100" rx="6" opacity="0.25"/>
    <rect x="-36" y="-70" width="72" height="100" rx="6" fill="url(#gold)" opacity="0.9"/>
  </g>
  <!-- Sparkle -->
  <circle cx="296" cy="148" r="4" fill="#D4AF37" opacity="0.6"/>
  <circle cx="316" cy="164" r="2.5" fill="#D4AF37" opacity="0.4"/>
  <!-- Text -->
  <text x="256" y="350" text-anchor="middle" font-family="serif" font-size="44" font-weight="700" fill="url(#gold)" letter-spacing="2">מרחב</text>
  <text x="256" y="400" text-anchor="middle" font-family="serif" font-size="44" font-weight="700" fill="url(#gold)" letter-spacing="2">הדעת</text>
  <!-- Subtle line -->
  <line x1="186" y1="418" x2="326" y2="418" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>
</svg>
